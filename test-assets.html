<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba logo y fachada</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f4efe7;color:#1f1f1f;padding:22px}
    .card{max-width:900px;margin:0 auto;background:white;border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
    h1{color:#1f6f2b;margin-top:0}.box{border:2px solid #cce7c9;border-radius:18px;padding:18px;margin:18px 0;background:#fffdf8}
    img{max-width:100%;height:auto;border:1px solid #ddd;border-radius:12px;background:white;padding:8px}.facade{width:100%;max-height:420px;object-fit:cover;padding:0}
    .ok{background:#eaf6e8;border:1px solid #cce7c9;padding:12px;border-radius:12px;font-weight:bold;color:#1f6f2b}
  </style>
</head>
<body>
  <div class="card">
    <h1>Prueba de imágenes · Residencia Santa Teresa</h1>
    <p class="ok">Esta página no usa PWA ni caché de la app. Sirve para comprobar si GitHub Pages está cargando el logo y la fachada.</p>
    <div class="box">
      <h2>Logo Diputación de Jaén</h2>
      <img src="https://raw.githubusercontent.com/izc05/residencia-santa-teresa-guia-cuidados/main/assets/diputacion-jaen-logo.svg?v=10" alt="Logo Diputación de Jaén">
    </div>
    <div class="box">
      <h2>Foto fachada residencia</h2>
      <img class="facade" src="https://raw.githubusercontent.com/izc05/residencia-santa-teresa-guia-cuidados/main/assets/residencia-santa-teresa-fachada.svg?v=10" alt="Fachada Residencia Santa Teresa">
    </div>
  </div>
</body>
</html>
